<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stem Player — 6</title>
    <link rel="stylesheet" href="shared/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mountPlayer } from './shared/player.js';
      import { STEM_BASE } from './shared/config.js';

      // `pan` seeds the initial spread. Filenames are URL-encoded because the
      // source files contain spaces.
      const files = [
        'loop-stem%201-Audio.mp3',
        'loop-stem%202-Audio.mp3',
        'loop-stem%203-Audio.mp3',
        'loop-stem%204-Audio.mp3',
        'loop-stem%205-Audio.mp3',
        'loop-stem%206-Audio.mp3',
      ];
      const pans = [-0.6, -0.35, -0.1, 0.1, 0.35, 0.6];

      mountPlayer({
        stems: files.map((file, i) => ({
          label: `Stem ${i + 1}`,
          url: STEM_BASE + file,
          pan: pans[i],
        })),
      });
    </script>
  </body>
</html>
